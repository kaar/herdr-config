# herdr-plugin.toml - manifest for fzf-url.
#
# Install from GitHub:
#   herdr plugin install kaar/herdr-config/plugins/fzf-url
#
# Local development (link does not run build steps):
#   herdr plugin link ~/.config/herdr/plugins/fzf-url
#
# Fuzzy-find and open URLs visible in the active pane, like tmux-fzf-url.
# The action opens a bounded Herdr popup because plugin actions run without a
# TTY and fzf needs an interactive terminal.

id = "kaar.fzf-url"
name = "fzf-url"
version = "0.1.0"
min_herdr_version = "0.7.4"
description = "Fuzzy-find and open URLs visible in the active pane, like tmux-fzf-url."
platforms = ["linux", "macos"]

[[actions]]
id = "fzf-url"
title = "fzf-url: open URL picker"
description = "Scan the active pane for URLs and open an fzf popup to open or copy them."
contexts = ["workspace"]
command = ["bash", "action-open"]

[[panes]]
id = "picker"
title = "Open URL"
placement = "popup"
width = "60%"
height = "40%"
command = ["bash", "picker"]
